[package]
name = "hx-echo"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Whale Mo <1552933+ncwhale@users.noreply.github.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9", features = ["d1"] }
worker-macros = { version = "0.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.12"
ammonia = "4.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
